version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finance_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-finance_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  finance_api:
    build:
      context: ./finance_api
      dockerfile: Dockerfile
    container_name: finance_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./finance_api/.env
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-finance_db}
      POSTGRES_PORT: 5432
      DATABASE_URL: ""
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_personal_finance_platform_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_refresh_key_personal_finance_platform_2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_MINUTES: 10080
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:80","http://localhost","http://127.0.0.1:3000"]'
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_TLS: ${SMTP_TLS}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      EMAILS_FROM_NAME: ${EMAILS_FROM_NAME}
      CHECK_EMAIL_DELIVERABILITY: ${CHECK_EMAIL_DELIVERABILITY:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./finance_api:/app

  finance_web:
    build:
      context: ./finance_web
      dockerfile: Dockerfile
    container_name: finance_web
    restart: always
    depends_on:
      - finance_api
    ports:
      - "3000:80"

volumes:
  postgres_data:
